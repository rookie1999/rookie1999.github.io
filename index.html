<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guozhi Zhan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #f7f8fa;
      --paper: #fcfcfd;
      --sidebar: #f0f4f5;
      --ink: #18202a;
      --muted: #66717d;
      --line: #dfe5e8;
      --line-strong: #c8d2d7;
      --accent: #177c82;
      --accent-soft: #e5f1f1;
      --warm: #bd5d3b;
      --font-body: "Inter", "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", Arial, sans-serif;
      --font-heading: "Manrope", "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html {
      max-width: 100%;
      overflow-x: clip;
      scroll-behavior: smooth;
      scroll-padding-top: 24px;
    }
    body {
      margin: 0;
      max-width: 100%;
      padding-left: 220px;
      overflow-x: clip;
      background: var(--canvas);
      color: var(--ink);
      font: 400 15px/1.76 var(--font-body);
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    img { display: block; max-width: 100%; }

    .wrap {
      display: block;
      width: 100%;
      min-height: 100vh;
      background: var(--paper);
    }

    .nav {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      width: 220px;
      height: 100vh;
      padding: 30px 22px 26px;
      background: var(--sidebar);
      border-right: 1px solid #d8ddda;
      color: var(--ink);
    }
    .nav-brand {
      display: block;
      margin-bottom: 30px;
      font-family: var(--font-heading);
    }
    .nav-brand-name {
      display: block;
      color: #17242b;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
    }
    .nav-brand-role {
      display: block;
      margin-top: 5px;
      color: #7a888e;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 500;
      line-height: 1.4;
    }
    .nav-label {
      margin: 0 0 13px 13px;
      color: #7f8c92;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .nav a {
      position: relative;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: center;
      min-height: 43px;
      padding: 7px 10px;
      border-left: 2px solid transparent;
      color: #536169;
      font-size: 14px;
      font-family: var(--font-heading);
      font-weight: 500;
      line-height: 1.35;
      transition: color .18s ease, background .18s ease, border-color .18s ease;
    }
    .nav a::before {
      content: attr(data-index);
      color: #98a5aa;
      font-size: 10px;
      font-weight: 600;
    }
    .nav a:hover {
      background: #e5ecee;
      color: #18262b;
    }
    .nav a.active {
      border-left-color: var(--accent);
      background: #dcebed;
      color: #12686d;
      font-weight: 600;
    }
    .nav a.active::before { color: var(--accent); }
    .top, main, .foot {
      width: min(calc(100% - 72px), 1040px);
      max-width: 1040px;
      margin-right: auto;
      margin-left: auto;
    }
    .top {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      padding: 46px 0 30px;
      border-bottom: 1px solid var(--line-strong);
    }
    .top::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 64px;
      height: 4px;
      background: var(--accent);
    }
    .name {
      max-width: 860px;
      margin: 0;
      color: #15202a;
      font-size: 48px;
      font-family: var(--font-heading);
      font-weight: 700;
      line-height: 1.12;
    }
    .lead {
      max-width: 850px;
      margin: 13px 0 0;
      color: #45525d;
      font-size: 17px;
      line-height: 1.72;
    }
    .focus {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .focus span {
      padding: 5px 9px;
      border: 1px solid #bdd9da;
      background: var(--accent-soft);
      color: #176a70;
      font-size: 11px;
      font-weight: 600;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 24px;
      margin-top: 15px;
      color: var(--muted);
      font-size: 13px;
    }
    .meta a {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: #9eaaa3;
      text-underline-offset: 4px;
    }
    .meta a:hover { color: var(--accent); }
    .lang {
      display: flex;
      align-self: start;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--line);
      background: #f7f8f7;
    }
    .lang button {
      width: 50px;
      height: 30px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .lang button.active { background: #173d46; color: #fff; }

    main { counter-reset: section; }
    .sec {
      counter-increment: section;
      padding: 36px 0 40px;
      border-bottom: 1px solid var(--line);
      scroll-margin-top: 20px;
    }
    .sec > h2 {
      display: flex;
      align-items: baseline;
      gap: 13px;
      margin: 0 0 19px;
      font-size: 26px;
      font-family: var(--font-heading);
      font-weight: 700;
      line-height: 1.25;
    }
    .sec > h2::before {
      content: "0" counter(section);
      display: inline-block;
      min-width: 36px;
      color: var(--accent);
      font-family: var(--font-heading);
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
    }
    .sec-intro {
      max-width: 760px;
      margin: -10px 0 20px 33px;
      color: var(--muted);
      font-size: 14px;
    }
    .sec-intro:empty, .foot:empty { display: none; }

    .about {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      border-top: 1px solid var(--line-strong);
    }
    .about p {
      margin: 0;
      padding: 15px 20px 0 0;
      color: #46535e;
      font-size: 14px;
    }
    .about p + p {
      padding-left: 20px;
      border-left: 1px solid var(--line);
    }
    .list { display: grid; }
    .entry {
      position: relative;
      min-width: 0;
      padding: 18px 0;
      border-top: 1px solid var(--line);
    }
    .entry:first-child { border-top-color: var(--line-strong); }
    .head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 148px;
      gap: 24px;
      align-items: start;
    }
    .title {
      margin: 0;
      color: #19242d;
      font-size: 20px;
      font-family: var(--font-heading);
      font-weight: 600;
      line-height: 1.38;
    }
    .time {
      padding-top: 4px;
      color: #78827c;
      font-size: 12px;
      font-weight: 600;
      text-align: right;
      white-space: nowrap;
    }
    .publine { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .badge {
      padding: 3px 8px;
      border: 1px solid #ccd5d0;
      border-radius: 2px;
      color: #5f6b64;
      font-size: 10px;
      font-weight: 700;
    }
    .badge:first-child { border-color: #bcd5c7; background: var(--accent-soft); color: var(--accent); }
    .desc { max-width: 900px; margin: 0; color: #4b5863; font-size: 14px; }
    .desc p { margin: 0 0 9px; }
    .desc p:last-child { margin-bottom: 0; }

    #internships .entry, #work .entry {
      display: grid;
      grid-template-columns: 215px minmax(0, 1fr);
      gap: 34px;
    }
    #internships .head, #work .head { display: block; }
    #internships .time, #work .time { margin-top: 6px; text-align: left; }
    #internships .desc, #work .desc { padding-top: 2px; }

    .project-entry { padding: 24px 0 29px; }
    #projects .head { grid-template-columns: minmax(0, 1fr); }
    #projects .time { display: none; }
    .project-entry .title { max-width: 820px; font-size: 24px; }
    .project-entry .desc { max-width: 920px; font-size: 14px; }
    .project-figure {
      margin: 15px 0 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #f7f8f7;
    }
    .project-figure img { width: 100%; height: auto; }
    .project-caption {
      display: block;
      padding: 9px 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }
    .project-links { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
    .project-link {
      padding: 6px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      color: #34423b;
      font-size: 11px;
      font-weight: 700;
    }
    .project-link:hover { border-color: var(--accent); background: var(--accent); color: #fff; }

    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    #cable-tie-post-training .videos {
      grid-template-columns: minmax(0, 520px);
      justify-content: start;
    }
    #bin-long-horizon .videos {
      grid-template-columns: minmax(0, 680px);
      justify-content: start;
    }
    .video-groups { display: grid; gap: 14px; min-width: 0; margin-top: 15px; }
    .video-group-label {
      margin-bottom: 8px;
      color: #727e77;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .video-strip {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 100%;
      padding: 0 0 8px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-color: #aebbb4 transparent;
      scrollbar-width: thin;
    }
    .video-strip .video-card { flex: 0 0 min(350px, 72vw); }
    .video, .video-card {
      display: block;
      min-width: 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #fafbfa;
    }
    .video-placeholder {
      display: flex;
      min-height: 170px;
      align-items: center;
      justify-content: center;
      border-style: dashed;
      color: var(--muted);
      text-align: center;
    }
    .video-player { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 2px; background: #111; }
    .video-meta { padding: 1px 2px 7px; }
    .video-kicker { display: block; color: var(--warm); font-size: 9px; font-weight: 800; text-transform: uppercase; }
    .video-title { display: block; margin-top: 7px; font-family: var(--font-heading); font-size: 13px; font-weight: 600; line-height: 1.4; }
    .video-card .video-title { margin: 0; }
    .video-note { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }

    .publication-entry {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 14px;
      padding: 14px 0;
    }
    .publication-index { color: var(--accent); font-size: 11px; font-weight: 700; }
    .publication-entry .title { font-size: 16px; }
    .foot { padding: 18px 0 24px; color: var(--muted); font-size: 12px; }

    @media (min-width: 521px) and (max-width: 900px) {
      body { padding-left: 176px; }
      .nav { width: 176px; padding: 26px 14px 22px; }
      .nav-brand { margin-bottom: 24px; }
      .nav-brand-name { font-size: 16px; }
      .nav-label { margin-left: 9px; }
      .nav a {
        grid-template-columns: 25px minmax(0, 1fr);
        min-height: 41px;
        padding: 6px 8px;
        font-size: 12px;
      }
      .top, main, .foot {
        width: calc(100% - 36px);
        max-width: none;
        margin-right: auto;
        margin-left: auto;
      }
      .top { grid-template-columns: 1fr; padding: 36px 0 26px; }
      .name { font-size: 40px; }
      .lang { position: absolute; top: 18px; right: 0; }
      .top > div:first-child { padding-top: 30px; }
      .about { grid-template-columns: 1fr; }
      .about p { padding: 12px 0; }
      .about p + p { padding-left: 0; border-top: 1px solid var(--line); border-left: 0; }
      #internships .entry, #work .entry { grid-template-columns: 1fr; gap: 10px; }
      .head { grid-template-columns: 1fr; gap: 5px; }
      .time { text-align: left; }
    }

    @media (max-width: 520px) {
      html { scroll-padding-top: 70px; }
      body { padding-left: 0; }
      .wrap { width: 100%; }
      .nav {
        position: sticky;
        top: 0;
        bottom: auto;
        left: auto;
        flex-direction: row;
        width: 100%;
        height: 58px;
        padding: 0 24px;
        overflow-x: auto;
        border-bottom: 1px solid #d8ddda;
        background: rgba(244, 246, 245, .98);
      }
      .nav-brand, .nav-label { display: none; }
      .nav a {
        display: block;
        flex: 0 0 auto;
        min-height: 58px;
        padding: 19px 14px 15px;
        border: 0;
        white-space: nowrap;
      }
      .nav a::before { display: none; }
      .nav a.active { box-shadow: inset 0 -2px var(--accent); }
      .top, main, .foot { width: calc(100% - 32px); max-width: none; margin-right: 16px; margin-left: 16px; }
      .top { padding: 38px 0 28px; }
    }

    @media (max-width: 520px) {
      body { font-size: 14px; }
      .nav { padding: 0 12px; }
      .nav a { padding-right: 11px; padding-left: 11px; font-size: 12px; }
      .top, main, .foot { width: calc(100% - 32px); }
      .top { grid-template-columns: 1fr; gap: 16px; padding: 30px 0 24px; }
      .name { font-size: 38px; }
      .lead { margin-top: 16px; font-size: 16px; }
      .lang { position: absolute; top: 18px; right: 0; }
      .top > div:first-child { padding-top: 30px; }
      .focus { padding-right: 0; }
      .meta { overflow-wrap: anywhere; }
      .sec { padding: 30px 0 34px; }
      .sec > h2 { margin-bottom: 16px; font-size: 23px; }
      .sec > h2::before { min-width: 32px; font-size: 23px; }
      .sec-intro { margin: -7px 0 16px 30px; }
      .about { grid-template-columns: 1fr; }
      .about p { padding: 12px 0; }
      .about p + p { padding-left: 0; border-top: 1px solid var(--line); border-left: 0; }
      .head { grid-template-columns: 1fr; gap: 5px; }
      .time { text-align: left; }
      #internships .entry, #work .entry { grid-template-columns: 1fr; gap: 12px; }
      .project-entry { padding: 20px 0 24px; }
      .project-entry .title { font-size: 20px; }
      .video-strip .video-card { flex-basis: 82vw; }
      .publication-entry { grid-template-columns: 28px minmax(0, 1fr); gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="nav" aria-label="Page navigation">
      <div class="nav-brand">
        <span class="nav-brand-name">Guozhi Zhan</span>
        <span class="nav-brand-role">Robotics Portfolio</span>
      </div>
      <div class="nav-label">Contents</div>
      <a href="#about" id="nav-about" data-index="01"></a>

      <a href="#work" id="nav-work" data-index="04"></a>

    <header class="top">
      <div>
        <h1 class="name" id="name"></h1>
        <p class="lead" id="lead"></p>

      </div>
      <div class="lang">
        <button type="button" data-lang="zh" class="active">中文</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </header>

    <main>
      <section class="sec" id="about">
        <h2 id="about-title"></h2>
        <div class="about">
          <p id="about-1"></p>
          <p id="about-2"></p>
          <p id="about-3"></p>
        </div>
      </section>

      <section class="sec" id="internships">
        <h2 id="internships-title"></h2>
        <div class="list" id="internship-list"></div>
      </section>

      <section class="sec" id="projects">
        <h2 id="projects-title"></h2>
        <p class="sec-intro" id="projects-intro"></p>
        <div class="list" id="project-list"></div>
      </section>

      <section class="sec" id="work">
        <h2 id="work-title"></h2>
        <div class="list" id="work-list"></div>
      </section>

      <section class="sec" id="publications">
        <h2 id="publications-title"></h2>
        <div class="list" id="publication-list"></div>
      </section>
    </main>

    <footer class="foot" id="foot"></footer>
  </div>

          { title: "UCAG-P", subtitle: "面向异构具身操作数据的相机中心 VLA 统一建模", kind: "科研", output: "AAAI 在投 / 第三作者", time: "2026.05 - 2026.08", desc: "面向机器人形态、相机配置与低层动作空间不一致导致的 VLA 数据难以统一训练问题，参与提出相机中心具身操作建模框架 UCAG-P，将单臂、双臂、人形机器人、灵巧手与人类演示数据对齐到共享视觉几何动作空间。参与构建基于腕部/末端执行器与抓取中心的双锚点动作表示，并协助实现几何条件化动作转换模块，将共享几何动作映射为目标机器人可执行控制指令。该方法基于 11 个数据集、超过 6,000 小时、覆盖 9 类机器人/人类本体的异构具身数据进行训练，在 LIBERO、LIBERO-Plus、RoboTwin Easy/Hard 与 RoboCasa GR1 上分别取得 98.25%、82.0%、88.45% / 89.12% 与 62.0% 成功率。", image: { src: "images/ucagp_overview.png", alt: "UCAG-P overview figure", caption: "UCAG-P 总览：异构数据源、相机中心几何表示与评测结果。" } },

        projects: [
          { title: "Value-Guided Offline RL Post-Training for Cable-Tie Threading", subtitle: "Value-guided offline RL post-training for cable-tie threading", kind: "Project", output: "None yet", time: "2026.06 - 2026.07", desc: "Built an interactive data loop on an ARX bimanual robot using Meta Quest teleoperation: demonstrations initialize the policy, autonomous rollouts are corrected by human takeover after failed insertion or hole misalignment, and the recovered trajectories are used for post-training. Following RECAP, a value model estimates return-to-go and labels advantageous actions from value changes over a fixed horizon using a 30% threshold; an ablation over successful, failed, and human-correction trajectories led to downsampling failed trajectories. Across 40 distinct initial poses with no intervention during evaluation, first-pass insertion succeeded in 31/40 trials (77.5%) and autonomous recovery raised final success to 39/40 (97.5%). With the same pi0.5 initialization and SFT data, RLT online reinforcement learning achieved 26/40 (65.0%).", videoSources: [{ href: "videos/2026_06_zhadai/2026_07_zhadai.mp4", title: "Cable-Tie Threading Demo", note: "", embed: true }] },
          { title: "Post-Training for Robotics Challenge", subtitle: "RSS 2026 real-world bimanual manipulation challenge", kind: "Challenge", output: "None yet", time: "2026.06 - 2026.07", desc: "Participated in the RSS 2026 Workshop on Post-Training for Robotics Foundation Models challenge, evaluating VLA post-training on three real-world bimanual manipulation tasks: mouse battery installation, Tower of Hanoi, and bottle-cap tightening. Ranked 7th on the official Phase 1 final Single-Task Track leaderboard, with task success rates of 60% / 0% / 60% and an average success rate of 40%. In a subsequent evaluation under the same protocol, Tower of Hanoi success improved to 20%." },
          { title: "VLA Multi-Object Grasping", subtitle: "Language-conditioned multi-object grasping with VLA", kind: "Project", output: "None yet", time: "2026.05 - 2026.06", desc: "Built a VLA data pipeline for language-conditioned grasping in multi-object scenes, covering grasp-clip mining, pre-grasp key-frame selection, object-box annotation, and language instruction augmentation. I designed a hierarchical region-language contrastive learning method that replaces whole-image features with target-region features and combines cross-object category contrast with fine-grained intra-class attribute contrast, improving target localization, discrimination, and grasping under natural-language instructions.\nThe videos below show instruction following and generalization in multi-object scenes: the first group uses a three-color block combination that never appeared together in training, the second group shows seen objects, and the third group isolates the OOD prompt \"pick up yellow pear\".", videoGroups: [{ label: "Bi-Granularity Contrastive Learning / Colored Blocks", items: [{ href: "videos/2026_05_grasp/orange_block.mp4", title: "pick up orange block", note: "", embed: true }, { href: "videos/2026_05_grasp/red_block.mp4", title: "pick up red block", note: "", embed: true }, { href: "videos/2026_05_grasp/blue_block.mp4", title: "pick up blue block", note: "", embed: true }] }, { label: "Seen Objects", items: [{ href: "videos/2026_05_grasp/bell.mp4", title: "pick up bell", note: "", embed: true }, { href: "videos/2026_05_grasp/bowl.mp4", title: "pick up bowl", note: "", embed: true }, { href: "videos/2026_05_grasp/eraser.mp4", title: "pick up eraser", note: "", embed: true }, { href: "videos/2026_05_grasp/plastic_bottle.mp4", title: "pick up plastic bottle", note: "", embed: true }, { href: "videos/2026_05_grasp/stapler.mp4", title: "pick up stapler", note: "", embed: true }] }, { label: "OOD Prompt", items: [{ href: "videos/2026_05_grasp/pear.mp4", title: "pick up yellow pear", note: "", embed: true }] }] },
          { title: "UCAG-P", subtitle: "Camera-centric unified VLA modeling for heterogeneous embodied manipulation data", kind: "Research", output: "AAAI under submission / third author", time: "2026.05 - 2026.08", desc: "Worked on camera-centric VLA modeling for heterogeneous embodied manipulation data, where robot embodiment, camera configuration, and low-level action spaces differ across datasets. I contributed to UCAG-P, which aligns single-arm, bimanual, humanoid, dexterous-hand, and human-demonstration data into a shared visual-geometric action space. I also contributed to a dual-anchor action representation based on wrist/end-effector and grasp-center motion, plus a geometry-conditioned action conversion module that maps shared geometric actions to executable robot commands. The model was trained on 11 datasets with over 6,000 hours of data covering 9 robot/human embodiments, achieving 98.25% on LIBERO, 82.0% on LIBERO-Plus, 88.45% / 89.12% on RoboTwin Easy/Hard, and 62.0% on RoboCasa GR1.", image: { src: "images/ucagp_overview.png", alt: "UCAG-P overview figure", caption: "UCAG-P overview: heterogeneous data sources, shared camera-centric geometry, and evaluation." } },

        "SpeedACT": "在 FastTouch 机械臂平台上，针对多速度动态抓取中的策略冲突，设计速度条件化专家路由与非对称时空正则化的 DynaMoE 框架。在 5 个速度级、每个速度级对 40 个物体各测试 10 次（共 2,000 次）真机评测中，成功率为 92.4% / 96.8% / 97.8% / 94.5% / 88.2%；两个未见中间速度级分别达到 96.8% 和 94.5%。",
        "MA-ACT": "在 SO100 机械臂平台上扩展 ACT，结合物体中心运动流与运动-视觉特征融合以建模目标运动。在每个速度 20 次试验的受控变速场景下，平均闭环抓取成功率为 100%；在每个速度 20 次试验的杂乱背景下，平均成功率为 91.7%。论文投稿至 TASE。",
        "ADCT": "提出基于经验树的 action and detection chunking 方法，用于缓解连续多目标抓取的误差累积；ADCT 在单场景和多场景多目标抓取中分别达到 96% 和 91% 成功率，迁移至 Diffusion Policy 后分别为 89% 和 88%。"
      },
      en: {
        "Value-Guided Offline RL Post-Training for Cable-Tie Threading": "Built an interactive data loop for cable-tie threading on an ARX bimanual robot using Meta Quest demonstrations plus successful, failed, and human-corrected trajectories. Value-guided offline RL enabled autonomous recovery after insertion failures, raising success from 77.5% on the first attempt to 97.5% after recovery across 40 initial poses.",
        "Post-Training for Robotics Challenge": "Developed and evaluated VLA post-training for mouse battery installation, Tower of Hanoi, and bottle-cap tightening in the RSS 2026 real-world bimanual manipulation challenge. Ranked 7th in the official Phase 1 Single-Task Track; a later evaluation improved Tower of Hanoi success from 0% to 20%.",
        "UCAG-P": "Contributed to the camera-centric VLA framework UCAG-P by implementing its geometry-conditioned action translator and leading Piper deployment and evaluation. Success reached 60% / 90% / 75% on bread pickup, drawer opening, and bowl stacking, versus 20% / 85% / 65% for pi0.5 under the same setup.",
        "VLA Multi-Object Grasping": "Built a language-conditioned multi-object grasping pipeline and designed region-language contrastive learning to reduce whole-image target interference. On a Piper bimanual platform, success improved from 43.6% to 97.3% for 37 seen categories and from 7.2% to 64.8% for 20 unseen categories.",
        "SpeedACT": "On a FastTouch robot arm, I developed DynaMoE, which combines velocity-conditioned expert routing and asymmetric spatiotemporal regularization to address policy conflicts in multi-speed dynamic grasping. Across five speed levels, with 10 real-robot trials for each of 40 objects at every level (2,000 trials total), success rates were 92.4% / 96.8% / 97.8% / 94.5% / 88.2%; the two held-out intermediate speed levels reached 96.8% and 94.5%.",
        "MA-ACT": "On an SO100 robot arm, I extended ACT with object-centric motion flow and motion-vision feature fusion to model target movement. With 20 trials at each speed, mean closed-loop grasp success was 100% in controlled variable-speed settings and 91.7% in cluttered settings. The paper is under submission to TASE.",
        "ADCT": "Proposed action and detection chunking based on experience trees to reduce accumulated error in sequential multi-target grasping. ADCT achieved 96% success in single-scene and 91% in multi-scene settings; when transferred to Diffusion Policy, success was 89% and 88%, respectively."
      }
    };

    const projectLinks = {
      "ADCT": [
        { href: "https://ieeexplore.ieee.org/document/11576545", zh: "论文（IEEE Xplore）", en: "Paper (IEEE Xplore)" },
        { href: "https://github.com/wbwwt/ADCT", zh: "代码（GitHub）", en: "Code (GitHub)" }
      ]
    };

    const projectMetadataOverrides = {
      zh: {
        "Value-Guided Offline RL Post-Training for Cable-Tie Threading": { time: "2026.05 - 2026.07" },
        "VLA Multi-Object Grasping": { time: "2026.05 - 2026.07" },
        "UCAG-P": { output: "AAAI \u5728\u6295" },
        "SpeedACT": { output: "RAL Revise" },
        "MA-ACT": { output: "TASE \u5728\u6295" },
        "ADCT": { output: "RAL\u5df2\u5f55\u7528" }
      },
      en: {
        "Value-Guided Offline RL Post-Training for Cable-Tie Threading": { time: "2026.05 - 2026.07" },
        "VLA Multi-Object Grasping": { time: "2026.05 - 2026.07" },
        "UCAG-P": { output: "AAAI under submission" },
        "SpeedACT": { output: "RAL Revise" },
        "MA-ACT": { output: "Under submission to TASE" },
        "ADCT": { output: "RAL published" }
      }
    };

    const projectTitleOverrides = {
      zh: {
        "RTC-Enabled Long-Horizon Bimanual Bin Manipulation": "双臂料箱长时连续操作：基于 RTC 与异步推理的 VLA 部署优化",
        "Value-Guided Offline RL Post-Training for Cable-Tie Threading": "双臂穿扎带自主恢复：基于价值模型的 VLA 后训练",
        "VLA Multi-Object Grasping": "多物体语言条件抓取：基于区域-语言对齐的 VLA 泛化优化",
        "Post-Training for Robotics Challenge": "RSS 2026 挑战赛真实双臂操作"
      },
      en: {}
    };

    const projectImageOverrides = {
      zh: {
        "SpeedACT": {
          src: "images/dynamoe_architecture.png",
          alt: "DynaMoE 论文架构图",
          caption: "DynaMoE 架构：速度条件化专家路由与混合专家动作解码。"
        },
        "MA-ACT": {
          src: "images/maact_architecture.png",
          alt: "MA-ACT 论文架构图",
          caption: "MA-ACT 架构：目标中心运动感知与运动-视觉特征融合。"
        }
      },
      en: {
        "SpeedACT": {
          src: "images/dynamoe_architecture.png",
          alt: "DynaMoE paper architecture",
          caption: "DynaMoE: velocity-conditioned expert routing and mixture-of-experts action decoding."
        },
        "MA-ACT": {
          src: "images/maact_architecture.png",
          alt: "MA-ACT paper architecture",
          caption: "MA-ACT: target-centric motion perception and motion-visual feature fusion."
        }
      }
    };

    function entryHTML(item, lang) {
      const descHTML = (item.desc || "").split("\n").map(part => `<p>${part}</p>`).join("");
      const links = projectLinks[item.title] || [];
      const linksHTML = links.length ? `<div class="project-links">${links.map(link => `<a class="project-link" href="${link.href}" target="_blank" rel="noopener noreferrer">${link[lang]} ↗</a>`).join("")}</div>` : "";
      const localizedTitle = projectTitleOverrides[lang][item.title];
      const displayTitle = localizedTitle || (item.title === "SpeedACT"
        ? "DynaMoE"
        : item.title);
      const subtitleHTML = localizedTitle ? "" : `<div class="publine">${item.subtitle}</div>`;
      const demoAnchors = {
        "RTC-Enabled Long-Horizon Bimanual Bin Manipulation": "bin-long-horizon",
        "Value-Guided Offline RL Post-Training for Cable-Tie Threading": "cable-tie-post-training",
        "VLA Multi-Object Grasping": "multi-object-grasping",
        "SpeedACT": "dynamoe-demo",
        "MA-ACT": "ma-act-demo"
      };
      const anchor = demoAnchors[item.title] || "";
      const imageHTML = item.image ? `
          <figure class="project-figure">
            <img src="${item.image.src}" alt="${item.image.alt}">
            ${item.image.caption ? `<figcaption class="project-caption">${item.image.caption}</figcaption>` : ""}
          </figure>
      ` : "";
      if (item.videoGroups) {
        const groups = item.videoGroups.map(group => `
        <div class="video-group">
          <div class="video-group-label">${group.label}</div>
          <div class="video-strip">
            ${group.items.map(source => `
              <div class="video-card">
                <div class="video-meta">
                  <span class="video-title">${source.title}</span>
                  ${source.note ? `<span class="video-note">${source.note}</span>` : ""}
                </div>
                <video class="video-player" controls preload="metadata">
                  <source src="${source.href}" type="video/mp4">
                </video>
              </div>
            `).join("")}
          </div>
        </div>
      `).join("");
        return `
        <article class="entry project-entry"${anchor ? ` id="${anchor}"` : ""}>
          <div class="head">
            <div>
              <h3 class="title">${displayTitle}</h3>
              ${subtitleHTML}
            </div>
            <div class="time">${item.time}</div>
          </div>
          <div class="badges">
            <span class="badge">${item.kind}</span>
            ${item.output && item.output !== copy[lang].outputNone ? `<span class="badge">${copy[lang].outputLabel}: ${item.output}</span>` : ""}
          </div>
          <div class="desc">${descHTML}</div>
          ${linksHTML}
          ${imageHTML}
          <div class="video-groups">${groups}</div>
        </article>
      `;
      }
      const sources = item.videoSources || [];
      const count = sources.length || item.videos || 0;
      const videos = Array.from({ length: count }, (_, i) => {
        const source = sources[i];
        const href = source ? source.href : "#";
        const title = source ? source.title : copy[lang].videoPlaceholder;
        const note = source ? source.note : item.title;
        if (source && source.placeholder) {
          return `
        <div class="video video-placeholder" role="status">
          <span>
            <span class="video-kicker">${copy[lang].videoLabel}</span>
            <span class="video-title">${title}</span>
            ${note ? `<span class="video-note">${note}</span>` : ""}
          </span>
        </div>
      `;
        }
        if (source && source.embed) {
          return `
        <div class="video-card">
          <div class="video-meta">
            <span class="video-title">${title}</span>
            ${note ? `<span class="video-note">${note}</span>` : ""}
          </div>
          <video class="video-player" controls preload="metadata">
            <source src="${href}" type="video/mp4">
          </video>
        </div>
      `;
        }
        return `
        <a class="video" href="${href}">
          <span class="video-kicker">${copy[lang].videoLabel}</span>
          <span class="video-title">${title}</span>
          ${note ? `<span class="video-note">${note}</span>` : ""}
        </a>
      `;
      }).join("");
      const videosHTML = videos ? `<div class="videos">${videos}</div>` : "";
      return `
        <article class="entry project-entry"${anchor ? ` id="${anchor}"` : ""}>
          <div class="head">
            <div>
              <h3 class="title">${displayTitle}</h3>
              ${subtitleHTML}
            </div>
            <div class="time">${item.time}</div>
          </div>
          <div class="badges">
            <span class="badge">${item.kind}</span>
            ${item.output && item.output !== copy[lang].outputNone ? `<span class="badge">${copy[lang].outputLabel}: ${item.output}</span>` : ""}
          </div>
          <div class="desc">${descHTML}</div>
          ${linksHTML}
          ${imageHTML}
          ${videosHTML}
        </article>
      `;
    }

    function internshipHTML(item) {
      return `
        <article class="entry">
          <div class="head">
            <div>
              <h3 class="title">${item.company}</h3>
              <div class="publine">${item.role}</div>
            </div>
            <div class="time">${item.time}</div>
          </div>
          <p class="desc">${item.desc}</p>
        </article>
      `;
    }

    function publicationHTML(item, index) {
      return `
        <article class="entry publication-entry">
          <span class="publication-index">${String(index + 1).padStart(2, "0")}</span>
          <div>
            <h3 class="title">${item.title}</h3>
            <p class="publine">${item.line}</p>
          </div>
        </article>
      `;
    }

    function setLang(lang) {
      const t = copy[lang];
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.querySelector('[data-lang="zh"]').textContent = "中文";
      document.getElementById("label-email").textContent = t.emailLabel;
      document.getElementById("name").textContent = t.name;
      document.getElementById("lead").textContent = t.lead;
      document.getElementById("nav-about").textContent = t.navAbout;
      document.getElementById("nav-projects").textContent = t.navProjects;
      document.getElementById("nav-internships").textContent = t.navInternships;
      document.getElementById("nav-work").textContent = t.navWork;
      document.getElementById("nav-publications").textContent = t.navPublications;
      document.getElementById("about-title").textContent = t.aboutTitle;
      document.getElementById("about-1").textContent = t.about1;
      document.getElementById("about-2").textContent = t.about2;
      document.getElementById("about-3").textContent = t.about3;
      document.getElementById("projects-title").textContent = t.projectsTitle;
      document.getElementById("projects-intro").textContent = t.projectsIntro;
      document.getElementById("internships-title").textContent = t.internshipsTitle;
      document.getElementById("work-title").textContent = t.workTitle;
      document.getElementById("publications-title").textContent = t.publicationsTitle;
      document.getElementById("foot").textContent = t.foot;
      const projectOrder = [
        "RTC-Enabled Long-Horizon Bimanual Bin Manipulation",
        "Value-Guided Offline RL Post-Training for Cable-Tie Threading",
        "VLA Multi-Object Grasping",
        "Post-Training for Robotics Challenge",
        "UCAG-P",
        "SpeedACT",
        "MA-ACT",
        "ADCT"
      ];
      const projects = [featuredProjects[lang], ...t.projects.map(item => ({
        ...item,
        ...(projectMetadataOverrides[lang][item.title] || {}),
        desc: projectDescriptionOverrides[lang][item.title] || item.desc,
        image: projectImageOverrides[lang][item.title] || item.image
      }))].sort((a, b) => projectOrder.indexOf(a.title) - projectOrder.indexOf(b.title));
      document.getElementById("project-list").innerHTML = projects.map(item => entryHTML(item, lang)).join("");
      const experiences = t.internships.map(item => ({
        ...item,
        desc: internshipDescriptionOverrides[lang][item.company] || item.desc
      }));
      document.getElementById("internship-list").innerHTML = experiences.slice(0, 2).map(internshipHTML).join("");
      document.getElementById("work-list").innerHTML = experiences.slice(2).map(internshipHTML).join("");
      document.getElementById("publication-list").innerHTML = t.publications.map(publicationHTML).join("");
      document.querySelectorAll("[data-lang]").forEach(btn => btn.classList.toggle("active", btn.dataset.lang === lang));
    }

    document.querySelectorAll("[data-lang]").forEach(btn => {
      btn.addEventListener("click", () => setLang(btn.dataset.lang));
    });

    const navLinks = [...document.querySelectorAll(".nav a")];
    const navSections = navLinks.map(link => document.querySelector(link.getAttribute("href")));
    function updateActiveNav() {
      let activeIndex = 0;
      navSections.forEach((section, index) => {
        if (section && section.getBoundingClientRect().top <= 180) activeIndex = index;
      });
      navLinks.forEach((link, index) => link.classList.toggle("active", index === activeIndex));
    }
    window.addEventListener("scroll", updateActiveNav, { passive: true });

    setLang("zh");
    updateActiveNav();
  </script>
</body>
</html>
