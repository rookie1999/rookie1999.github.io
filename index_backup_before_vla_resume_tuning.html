        projects: [
          { title: "Online RL Post-Training for Dressing Tasks", subtitle: "VLA plus RL post-training for dressing tasks", kind: "Project", output: "None yet", time: "2026.06 - 2026.07", desc: "Designed the online RL post-training workflow and real-robot validation loop for a long-horizon dressing task.\nBuilt a critic-guided local action editing strategy that improves correction and recovery while preserving VLA priors.\nRaised task success from 35% to 78%.", videoGroups: [{ label: "Real-Robot Demo", items: [{ href: "videos/2026_06_zhadai/2026_07_zhadai.mp4", title: "Real-Robot Dressing Demo", note: "Highlights recovery and correction during long-horizon execution", embed: true }] }] },
          { title: "VLA Multi-Object Grasping", subtitle: "Language-conditioned multi-object grasping with VLA", kind: "Project", output: "None yet", time: "2026.05 - 2026.06", desc: "Built the training set from AgiBot, RoboChallenge v1/v2, and self-collected data by using Songling arm IK trajectories to extract grasp segments covering approach, gripper close, and lift, then locating the start, close, and end frames.\nUsed Grounding DINO on key frames to produce target boxes, and trained the VLM to predict boxes so object location information is injected during training without changing the model input format or requiring a detection head at test time.\nGenerated about 50 prompts per object with an LLM, covering base commands, synonym swaps, color descriptions, functional descriptions, and paraphrased sentence forms, then added a bi-granularity contrastive loss that raised different-object accuracy from 45% to 95% and same-object different-color accuracy from 30% to 85%; the model can also use fine-grained prompt descriptions to identify and grasp unseen OOD objects among multiple candidates.", videoGroups: [{ label: "Test-Scene Generalization / Colored Blocks", note: "The evaluation scene differs from the scene layouts seen during training; relevant single objects appear in the data, but not in this joint layout.", items: [{ href: "videos/2026_05_grasp/orange_block.mp4", title: "pick up orange block", note: "", embed: true }, { href: "videos/2026_05_grasp/red_block.mp4", title: "pick up red block", note: "", embed: true }, { href: "videos/2026_05_grasp/blue_block.mp4", title: "pick up blue block", note: "", embed: true }] }, { label: "Test-Scene Generalization / Open-Dataset Objects", note: "The evaluation scene differs from the scene layouts seen during training; bell, bowl, eraser, plastic bottle, and stapler appear as single objects in the data, but not in the same simultaneous arrangement.", items: [{ href: "videos/2026_05_grasp/bell.mp4", title: "pick up bell", note: "", embed: true }, { href: "videos/2026_05_grasp/bowl.mp4", title: "pick up bowl", note: "", embed: true }, { href: "videos/2026_05_grasp/eraser.mp4", title: "pick up eraser", note: "", embed: true }, { href: "videos/2026_05_grasp/plastic_bottle.mp4", title: "pick up plastic bottle", note: "", embed: true }, { href: "videos/2026_05_grasp/stapler.mp4", title: "pick up stapler", note: "", embed: true }] }, { label: "OOD Prompt", items: [{ href: "videos/2026_05_grasp/pear.mp4", title: "\"pick up yellow pear\"", note: "Shows the model can use attribute-level prompt descriptions to localize and grasp an unseen OOD object in a multi-object scene", embed: true }] }] },
          { title: "SpeedACT", subtitle: "Kinematic-guided imitation learning for multi-speed dynamic grasping", kind: "Research", output: "RAL revise / under submission", time: "2026.01 - 2026.03", desc: "Addressed the core failure mode of conveyor-belt dynamic grasping, where a single policy struggles to balance low-speed precision with high-speed interception, by proposing DynaMoE, a velocity-conditioned imitation learning framework with an explicit speed prior.\nThe method extends ACT's CVAE backbone with explicit velocity conditioning: the encoder uses a speed embedding as a global kinematic anchor, the decoder adopts a kinematic-guided MoE architecture to route tokens across speed-specific experts, and an asymmetric spatiotemporal regularization term applies stronger spatial supervision as speed increases while enforcing first-order action-difference alignment across all speed regimes.\nBuilt the real-world dataset over 40 objects with 50 demonstration trajectories per object at each of the three training speeds: Low, Medium, and High. The method achieved 92.4% / 96.8% / 97.8% / 94.5% / 88.2% success across Low / Low-Med / Medium / Med-High / High, substantially outperforming ACT, MAE-ACT, and MoE-ACT, and produced a first-author RAL revise manuscript.", videoGroups: [{ label: "Training Speeds", items: [{ href: "videos/2026_03_dynamic_grasp/speeds/speed_0.mp4", title: "Low Speed", note: "", embed: true }, { href: "videos/2026_03_dynamic_grasp/speeds/speed_4.mp4", title: "High Speed", note: "", embed: true }] }, { label: "Held-out Speeds", items: [{ href: "videos/2026_03_dynamic_grasp/speeds/speed_1.mp4", title: "Low-Medium Speed", note: "", embed: true }, { href: "videos/2026_03_dynamic_grasp/speeds/speed_3.mp4", title: "Medium-High Speed", note: "", embed: true }] }] },
          { title: "MA-ACT", subtitle: "Motion-aware imitation learning for dynamic grasping", kind: "Research", output: "Under submission", time: "2025.03 - 2025.10", desc: "Proposed Motion-Aware ACT (MA-ACT) for multi-speed dynamic grasping, targeting the failure mode where visuomotor policies overfit spurious visual correlations instead of learning stable object kinematics.\nThe model uses only a single top-view camera as input: a visual branch encodes global image features from the current observation, while a motion branch uses YOLO to localize the grasp target, applies PWC-Net to estimate optical flow between consecutive frames, and extracts flow features inside the detected box as object-centric motion cues.\nThese motion cues are fused into the global visual representation through Motion-Contextualized Visual Fusion (MCVF), after which the ACT decoder generates the action sequence from the fused features. Using 210 real demonstrations across Low / Medium / High speeds (50 / 70 / 90), the model reached up to 100% average success in the controlled setting and 91.7% in a cluttered setting with static distractors, outperforming the primary visuomotor baseline by 25 percentage points.", videoSources: [{ href: "videos/2026_01_dynamic_grasp/low_speed.mp4", title: "Low-Speed Dynamic Grasping", note: "", embed: true }, { href: "videos/2026_01_dynamic_grasp/high_speed.mp4", title: "High-Speed Dynamic Grasping", note: "", embed: true }, { href: "videos/2026_01_dynamic_grasp/high_speed_with_distractors.mp4", title: "High-Speed Grasping with Distractors", note: "", embed: true }] }
        ]
      }
    };

    function entryHTML(item, lang) {
      const descHTML = (item.desc || "").split("\n").map(part => `<p>${part}</p>`).join("");
      if (item.videoGroups) {
        const groups = item.videoGroups.map(group => `
        <div class="video-group">
          <div class="video-group-label">${group.label}</div>
          ${group.note ? `<div class="video-group-note">${group.note}</div>` : ""}
          <div class="video-strip">
            ${group.items.map(source => `
              <div class="video-card">
                <div class="video-meta">
                  <span class="video-title">${source.title}</span>
                  ${source.note ? `<span class="video-note">${source.note}</span>` : ""}
                </div>
                <video class="video-player" controls preload="metadata">
                  <source src="${source.href}" type="video/mp4">
                </video>
              </div>
            `).join("")}
          </div>
        </div>
      `).join("");
        return `
        <article class="entry">
          <div class="head">
            <div>
              <h3 class="title">${item.title}</h3>
              <div class="publine">${item.subtitle}</div>
            </div>
            <div class="time">${item.time}</div>
          </div>
          <div class="badges">
            <span class="badge">${item.kind}</span>
            ${item.output && item.output !== copy[lang].outputNone ? `<span class="badge">${copy[lang].outputLabel}: ${item.output}</span>` : ""}
          </div>
          <div class="desc">${descHTML}</div>
          <div class="video-groups">${groups}</div>
        </article>
      `;
      }
      const sources = item.videoSources || [];
      const count = sources.length || item.videos || 0;
      const videos = Array.from({ length: count }, (_, i) => {
        const source = sources[i];
        const href = source ? source.href : "#";
        const title = source ? source.title : copy[lang].videoPlaceholder;
        const note = source ? source.note : item.title;
        if (source && source.embed) {
          return `
        <div class="video-card">
          <div class="video-meta">
            <span class="video-title">${title}</span>
            ${note ? `<span class="video-note">${note}</span>` : ""}
          </div>
          <video class="video-player" controls preload="metadata">
            <source src="${href}" type="video/mp4">
          </video>
        </div>
      `;
        }
        return `
        <a class="video" href="${href}">
          <span class="video-kicker">${copy[lang].videoLabel}</span>
          <span class="video-title">${title}</span>
          ${note ? `<span class="video-note">${note}</span>` : ""}
        </a>
      `;
      }).join("");
      return `
        <article class="entry">
          <div class="head">
            <div>
              <h3 class="title">${item.title}</h3>
              <div class="publine">${item.subtitle}</div>
            </div>
            <div class="time">${item.time}</div>
          </div>
          <div class="badges">
            <span class="badge">${item.kind}</span>
            ${item.output && item.output !== copy[lang].outputNone ? `<span class="badge">${copy[lang].outputLabel}: ${item.output}</span>` : ""}
          </div>
          <div class="desc">${descHTML}</div>
          <div class="videos">${videos}</div>
        </article>
      `;
    }

    function internshipHTML(item) {
      return `
        <article class="entry">
          <div class="head">
            <div>
              <h3 class="title">${item.company}</h3>
              <div class="publine">${item.role}</div>
            </div>
            <div class="time">${item.time}</div>
          </div>
          <p class="desc">${item.desc}</p>
        </article>
      `;
    }

    function publicationHTML(item) {
      return `
        <article class="entry">
          <h3 class="title">${item.title}</h3>
          <p class="publine">${item.line}</p>
        </article>
      `;
    }

    function focusHTML(item) {
      return `<div class="focus-item">${item}</div>`;
    }

    function splitExperience(items) {
      const list = items || [];
      return {
        internships: list.filter(item => !/Infor/i.test(item.company)),
        work: list.filter(item => /Infor/i.test(item.company))
      };
    }

    function setLang(lang) {
      const t = copy[lang];
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.querySelector('[data-lang="zh"]').textContent = "中文";
      document.getElementById("label-email").textContent = t.emailLabel;
      document.getElementById("name").textContent = t.name;
      document.getElementById("lead").textContent = t.lead;
      document.getElementById("nav-about").textContent = t.navAbout;
      document.getElementById("nav-focus").textContent = t.navFocus;
      document.getElementById("nav-projects").textContent = t.navProjects;
      document.getElementById("nav-internships").textContent = t.navInternships;
      document.getElementById("nav-publications").textContent = t.navPublications;
      document.getElementById("about-title").textContent = t.aboutTitle;
      document.getElementById("about-1").textContent = t.about1;
      document.getElementById("about-2").textContent = t.about2;
      document.getElementById("about-3").textContent = t.about3;
      document.getElementById("focus-title").textContent = t.focusTitle;
      document.getElementById("focus-intro").textContent = t.focusIntro;
      document.getElementById("focus-list").innerHTML = t.focusItems.map(focusHTML).join("");
      document.getElementById("projects-title").textContent = t.projectsTitle;
      document.getElementById("projects-intro").textContent = t.projectsIntro;
      document.getElementById("internships-title").textContent = t.internshipsTitle;
      document.getElementById("publications-title").textContent = t.publicationsTitle;
      document.getElementById("foot").textContent = t.foot;
      document.getElementById("project-list").innerHTML = t.projects.map(item => entryHTML(item, lang)).join("");
      document.getElementById("internship-list").innerHTML = t.internships.map(internshipHTML).join("");
      document.getElementById("publication-list").innerHTML = t.publications.map(publicationHTML).join("");
      document.querySelectorAll("[data-lang]").forEach(btn => btn.classList.toggle("active", btn.dataset.lang === lang));
    }

    document.querySelectorAll("[data-lang]").forEach(btn => {
      btn.addEventListener("click", () => setLang(btn.dataset.lang));
    });

    function postRenderAdjustments(lang) {
      const zhButton = document.querySelector('[data-lang="zh"]');
      if (zhButton) {
        zhButton.textContent = "中文";
      }

      const navWork = document.getElementById("nav-work");
      const workTitle = document.getElementById("work-title");
      if (navWork) {
        navWork.textContent = lang === "zh" ? "工作经历" : "Work Experience";
      }
      if (workTitle) {
        workTitle.textContent = lang === "zh" ? "工作经历" : "Work Experience";
      }

      const internshipList = document.getElementById("internship-list");
      const workList = document.getElementById("work-list");
      if (internshipList && workList) {
        workList.innerHTML = "";
        Array.from(internshipList.querySelectorAll(".entry")).forEach(entry => {
          const title = entry.querySelector(".title");
          if (title && /Infor/i.test(title.textContent)) {
            workList.appendChild(entry);
          }
        });
      }

      const projectEntries = Array.from(document.querySelectorAll("#project-list .entry"));
      for (const entry of projectEntries) {
        const title = entry.querySelector(".title");
        if (!title) {
          continue;
        }
        if (/VLA Multi-Object Grasping/i.test(title.textContent)) {
          const paragraphs = entry.querySelectorAll(".desc p");
          if (paragraphs.length >= 2) {
            paragraphs[0].textContent = `${paragraphs[0].textContent} ${paragraphs[1].textContent}`;
            paragraphs[1].remove();
          }
          break;
        }
      }
    }

    const originalSetLang = setLang;
    setLang = function(lang) {
      originalSetLang(lang);
      postRenderAdjustments(lang);
    };

    setLang("zh");
  </script>
</body>
</html>
